name: NoteGuardian Bot CI

on:
  push:
    paths:
      - 'scripts/pr_bot.py'
      - 'tests/**'
      - '.github/workflows/test-bot.yml'
  pull_request:
    paths:
      - 'scripts/pr_bot.py'
      - 'tests/**'
      - '.github/workflows/test-bot.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Run tests
        run: pytest tests/
