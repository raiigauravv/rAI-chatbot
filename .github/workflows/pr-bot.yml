name: PR Comment Bot (DS)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-comment-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # (Optional) run your model eval first so metrics.json exists
      # - name: Run model evaluation (example)
      #   run: |
      #     python - << 'PY'
      #     import json, random
      #     metrics = {"accuracy": 0.87, "f1": 0.84, "precision": 0.85, "recall": 0.83}
      #     with open("metrics.json","w") as f: json.dump(metrics, f)
      #     print("Wrote metrics.json")
      #     PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests nbformat

      - name: Run PR bot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/pr_bot.py
